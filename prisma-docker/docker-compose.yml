version: '3.8'

services:
  database:
    image: postgres:16   
    container_name: postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: postgres-prisma
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    container_name: postgres-prisma-app
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - database
    environment:
      DATABASE_URL: "postgresql://postgres:root@database:5432/postgres-prisma"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run dev

volumes:
  postgres-data: